server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /stub_status {
        stub_status;
        allow all;
    }
}
