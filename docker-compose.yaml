services:
  app:
    image: devops-nginx-app:latest
    container_name: demo-nginx-app
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - devops-net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://app:80/stub_status"
    ports:
      - "9113:9113"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - devops-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks:
      - devops-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - devops-net

volumes:
  grafana-data:

networks:
  devops-net:
